<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mary Grace - Estimating Desk</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <!-- Login view removed while AUTH_DISABLED (Zac 27/07). Restore from git
         history (commit 51df61b) when the login gate comes back. -->
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="mark"><img src="/fenster-logo.png" alt="Fenster Glazing"></span>
          <div>
            <strong>Mary Grace's Desk</strong>
            <small id="active-user"></small>
          </div>
        </div>
        <nav id="tabs" class="tabs" aria-label="Dashboard tabs"></nav>
        <button id="logout" class="ghost-button">Sign out</button>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Live estimating desk - updated <span id="updated-at"></span></p>
            <h2 id="view-title">Deadlines</h2>
          </div>
        </header>
        <section id="view"></section>
      </section>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
