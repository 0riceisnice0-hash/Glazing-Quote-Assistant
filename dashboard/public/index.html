<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mary Grace - Estimating Hub</title>
    <link rel="icon" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="/logo-dark.png" alt="Fenster Glazing" class="brand-logo">
          <div class="brand-sub">Mary Grace <span>Estimating Hub</span></div>
        </div>
        <nav id="tabs" class="tabs" aria-label="Hub sections"></nav>
        <div class="sidebar-foot">
          <div class="pulse-dot"></div>
          <div>
            <strong>Mary is live</strong>
            <small id="updated-at"></small>
          </div>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="view-eyebrow">Estimating operations</p>
            <h2 id="view-title">Overview</h2>
          </div>
          <div class="topbar-right">
            <label class="who">I am
              <select id="who">
                <option value="zac">Zac</option>
                <option value="adam">Adam</option>
              </select>
            </label>
          </div>
        </header>
        <section id="view" class="view"></section>
      </section>
    </div>

    <div id="drawer-veil" class="drawer-veil" hidden></div>
    <aside id="drawer" class="drawer" hidden>
      <button id="drawer-close" class="drawer-close" aria-label="Close">&times;</button>
      <div id="drawer-body"></div>
    </aside>

    <script src="/app.js" type="module"></script>
  </body>
</html>
