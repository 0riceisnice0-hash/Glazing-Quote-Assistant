<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mary Grace - Estimating Desk</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="login" class="login-view">
      <section class="login-panel">
        <p class="eyebrow">Estimating operations</p>
        <h1>Mary Grace's Desk</h1>
        <p class="login-copy">Everything Mary sees: deadlines, actions waiting on humans, every email sent, every catch made.</p>
        <form id="login-form">
          <label>
            User
            <select name="username">
              <option value="zac">Zac</option>
              <option value="adam">Adam</option>
            </select>
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password">
          </label>
          <button type="submit">Open desk</button>
          <p id="login-error" class="error" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <div id="app" class="app-shell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <span class="mark"><img src="/fenster-logo.png" alt="Fenster Glazing"></span>
          <div>
            <strong>Mary Grace's Desk</strong>
            <small id="active-user"></small>
          </div>
        </div>
        <nav id="tabs" class="tabs" aria-label="Dashboard tabs"></nav>
        <button id="logout" class="ghost-button">Sign out</button>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Live estimating desk - updated <span id="updated-at"></span></p>
            <h2 id="view-title">Deadlines</h2>
          </div>
        </header>
        <section id="view"></section>
      </section>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
