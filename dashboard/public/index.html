<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mary Grace - Fenster Estimating</title>
    <link rel="icon" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <!-- Phone only. The sidebar becomes a drawer below 900px, so there has to be
         something on screen that opens it and says where you are. -->
    <div class="mobile-bar">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        <i id="nav-dot" class="nav-toggle-dot" hidden></i>
      </button>
      <span id="mobile-title" class="mobile-title"></span>
      <span class="mobile-state"><i class="dot" id="mary-dot-m"></i></span>
    </div>
    <div id="nav-veil" class="nav-veil" hidden></div>

    <div class="shell">
      <aside class="nav" id="nav">
        <div class="nav-brand">
          <img src="/logo-dark.png" alt="Fenster Glazing">
        </div>
        <button class="nav-mary nav-bot active" data-bot="mary" type="button">
          <div class="avatar">MG</div>
          <div>
            <strong>Mary Grace</strong>
            <span class="role">Estimating</span>
            <span class="live"><i class="dot" id="mary-dot"></i> <span id="mary-state">Live</span></span>
            <span class="live-when" id="updated-at"></span>
          </div>
        </button>
        <button class="nav-mary nav-bot" data-bot="jacob" type="button">
          <div class="avatar jw">JW</div>
          <div>
            <strong>Jacob Wright</strong>
            <span class="role">Business development</span>
            <span class="live"><i class="dot build"></i> <span>In build</span></span>
          </div>
        </button>
        <nav id="nav-items" class="nav-items" aria-label="Sections"></nav>
        <div class="nav-foot">
          <label>Signed in as
            <select id="who">
              <option value="zac">Zac</option>
              <option value="adam">Adam</option>
            </select>
          </label>
        </div>
      </aside>

      <div class="main">
        <header class="page-head">
          <div>
            <h1 id="page-title"></h1>
            <p id="page-sub" class="page-sub"></p>
          </div>
          <div class="page-tools">
            <input id="search" type="search" placeholder="Filter this page..." autocomplete="off">
          </div>
        </header>
        <main id="page" class="page"></main>
      </div>
    </div>

    <div id="panel-veil" class="panel-veil" hidden></div>
    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="panel-close" aria-label="Close">&times;</button>
      <div id="panel-body"></div>
    </aside>

    <div id="toast" class="toast" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
