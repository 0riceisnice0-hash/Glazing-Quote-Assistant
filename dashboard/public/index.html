<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fenster Hub</title>
    <link rel="icon" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <!-- Phone only. The sidebar becomes a drawer below 900px, so there has to be
         something on screen that opens it and says where you are. -->
    <div class="mobile-bar">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        <i id="nav-dot" class="nav-toggle-dot" hidden></i>
      </button>
      <span id="mobile-title" class="mobile-title"></span>
      <!-- The name lives behind the drawer on a phone, which is exactly where
           it got missed. On this bar it is always on screen and tapping it
           switches. -->
      <button id="who-chip" class="who-chip" type="button" hidden></button>
      <span class="mobile-state"><i class="dot" id="mary-dot-m"></i></span>
    </div>
    <div id="nav-veil" class="nav-veil" hidden></div>

    <div class="shell">
      <aside class="nav" id="nav">
        <div class="nav-brand">
          <img src="/logo-dark.png" alt="Fenster Glazing">
        </div>
        <!-- One card per bot (plus the Team view), generated by app.js from the
             BOTS registry - adding a bot must never mean editing this file. -->
        <div id="bot-cards"></div>
        <nav id="nav-items" class="nav-items" aria-label="Sections"></nav>
        <!-- Not a dropdown any more. A dropdown has a first option, and the
             first option is what everyone sends as - see the sign-in card
             below. -->
        <div class="nav-foot">
          <span class="nav-me">Signed in as <strong id="who-name">nobody</strong></span>
          <button id="who-switch" class="who-switch" type="button">Not you?</button>
        </div>
      </aside>

      <div class="main">
        <header class="page-head">
          <div>
            <h1 id="page-title"></h1>
            <p id="page-sub" class="page-sub"></p>
          </div>
          <div class="page-tools">
            <input id="search" type="search" placeholder="Filter this page..." autocomplete="off">
          </div>
        </header>
        <main id="page" class="page"></main>
      </div>
    </div>

    <div id="panel-veil" class="panel-veil" hidden></div>
    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="panel-close" aria-label="Close">&times;</button>
      <div id="panel-body"></div>
    </aside>

    <!-- Who is at the keyboard. Adam, 29/07: the old dropdown defaulted to Zac
         and he kept forgetting to change it, so his instructions went onto the
         record under someone else's name. There is no login here and the hub
         cannot tell whose phone it is, so the honest version is to ASK on a
         device that has not answered, and remember the answer after that.
         Covers the whole page and cannot be dismissed until it is answered. -->
    <div id="signin" class="signin" hidden>
      <div class="signin-card">
        <!-- The mark, not logo-dark.png: that one is the white-on-navy variant
             and its wordmark disappears on a white card. -->
        <img src="/fenster-logo.png" alt="Fenster Glazing" class="signin-logo">
        <h2>Who is this?</h2>
        <p>Everything sent from here reaches Mary and Jacob under this name, and
          they act on it. This browser will remember your answer.</p>
        <div class="signin-picks">
          <button class="signin-pick" type="button" data-me="adam">
            <strong>Adam</strong><span>Commercial Director</span></button>
          <button class="signin-pick" type="button" data-me="zac">
            <strong>Zac</strong><span>Marketing, and builds this</span></button>
        </div>
        <button id="signin-cancel" class="signin-cancel" type="button" hidden>Cancel</button>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
